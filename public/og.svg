<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1a1f"/>
      <stop offset="100%" stop-color="#05090b"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9ff4a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="rgba(184,221,225,0.06)" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- radar sweep arc -->
  <path d="M620 340 A220 220 0 0 1 900 220" fill="none" stroke="url(#sweep)" stroke-width="48" opacity="0.35"/>
  <path d="M620 340 A180 180 0 0 1 820 200" fill="none" stroke="#d9ff4a" stroke-width="2" opacity="0.4"/>

  <!-- alert dots -->
  <g filter="url(#glow)">
    <circle cx="480" cy="280" r="6" fill="#d9ff4a"/>
    <circle cx="560" cy="320" r="5" fill="#d9ff4a"/>
    <circle cx="640" cy="260" r="7" fill="#d9ff4a"/>
    <circle cx="720" cy="300" r="5" fill="#52e0d0"/>
    <circle cx="700" cy="380" r="6" fill="#d9ff4a"/>
    <circle cx="800" cy="340" r="5" fill="#ff9f43"/>
    <circle cx="520" cy="360" r="4" fill="#52e0d0"/>
    <circle cx="880" cy="280" r="5" fill="#d9ff4a"/>
    <circle cx="420" cy="320" r="5" fill="#d9ff4a"/>
  </g>

  <!-- bolt -->
  <path d="M86 120 L70 190 L95 190 L78 270 L130 175 L100 175 L120 120 Z" fill="#d9ff4a" filter="url(#glow)"/>

  <!-- title -->
  <text x="150" y="200" font-family="Arial Black, Helvetica, sans-serif" font-size="92" font-weight="900" letter-spacing="2" fill="#edf8f7">STORM</text>
  <text x="520" y="200" font-family="Arial Black, Helvetica, sans-serif" font-size="92" font-weight="900" letter-spacing="2" fill="#d9ff4a">IQ</text>

  <!-- subtitle -->
  <text x="150" y="250" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#52e0d0">LIVE STORM INTELLIGENCE</text>

  <!-- status line -->
  <circle cx="150" cy="560" r="6" fill="#d9ff4a"/>
  <text x="168" y="566" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#8fa6a8">SYSTEM STATUS: OPERATIONAL</text>

  <!-- corner marks -->
  <g stroke="rgba(217,255,74,0.35)" stroke-width="2" fill="none">
    <path d="M40 40 H90 M40 40 V90"/>
    <path d="M1160 40 H1110 M1160 40 V90"/>
    <path d="M40 590 H90 M40 590 V540"/>
    <path d="M1160 590 H1110 M1160 590 V540"/>
  </g>
</svg>
