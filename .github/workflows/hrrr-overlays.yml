name: HRRR overlays

on:
  workflow_dispatch:
    inputs:
      fxx:
        description: "Forecast hour (0–18)"
        required: false
        default: "1"
      skip_cape:
        description: "Skip CAPE layer (true/false)"
        required: false
        default: "false"
      skip_refl:
        description: "Skip reflectivity layer (true/false)"
        required: false
        default: "false"

  schedule:
    - cron: "20 */3 * * *"

concurrency:
  group: hrrr-overlays
  cancel-in-progress: true

jobs:
  render:
    name: Render HRRR PNGs + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system eccodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/hrrr/requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          # No pip eccodes — system libeccodes is enough for cfgrib
          pip install -r scripts/hrrr/requirements.txt

      - name: Render overlays
        env:
          HERBIE_DATA: ${{ github.workspace }}/.herbie-data
        run: |
          mkdir -p public/hrrr .herbie-data
          FXX="${{ github.event.inputs.fxx || '1' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.skip_cape }}" = "true" ]; then EXTRA="$EXTRA --skip-cape"; fi
          if [ "${{ github.event.inputs.skip_refl }}" = "true" ]; then EXTRA="$EXTRA --skip-refl"; fi
          python scripts/hrrr/render_hrrr_overlays.py \
            --out public/hrrr \
            --fxx "$FXX" \
            --dpi 110 \
            $EXTRA

      - name: Show outputs
        run: |
          ls -la public/hrrr || true
          echo "---- manifest ----"
          cat public/hrrr/manifest.json || true

      - name: Commit and push public/hrrr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hrrr/manifest.json public/hrrr/refl.png public/hrrr/cape.png || true
          if git diff --staged --quiet; then
            echo "No overlay changes to commit"
          else
            git commit -m "chore: update HRRR map overlays [skip ci]"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-overlays
          path: public/hrrr/
          if-no-files-found: warn
          retention-days: 3
